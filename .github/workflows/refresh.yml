name: refresh stars

on:
  schedule:
    # 22:00 UTC Sunday == 06:00 Monday in UTC+8
    - cron: '0 22 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull starred repos
        env:
          STARS_TOKEN: ${{ secrets.STARS_TOKEN }}
        run: python scripts/fetch_stars.py

      - name: Apply summaries queue (data/summaries.tsv)
        run: python scripts/apply_summaries.py

      - name: Build index.html
        run: python scripts/gen_html.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "chore: weekly star refresh"
            git push
          fi
