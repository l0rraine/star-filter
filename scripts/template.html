<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star 检索</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#14171a;--mute:#6b7280;--line:#e5e7eb;--blue:#2563eb;--soft:#eef2ff}
*{box-sizing:border-box}
body{margin:0;padding:26px 18px 60px;background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1060px;margin:0 auto}
.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
h1{font-size:17px;font-weight:650;margin:0;letter-spacing:.2px}
.hint{font-size:12.5px;color:var(--mute)}
.box{position:relative;margin-bottom:12px}
#q{width:100%;height:52px;padding:0 46px 0 16px;font-size:16px;border:1px solid var(--line);
 border-radius:12px;background:#fff;outline:none;transition:.15s;
 box-shadow:0 1px 2px rgba(16,24,40,.04)}
#q:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
#clr{position:absolute;right:12px;top:14px;width:24px;height:24px;border:0;background:none;
 color:#9ca3af;font-size:18px;cursor:pointer;display:none;line-height:1}
.cats{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{font-size:12.5px;padding:5px 11px;border:1px solid var(--line);border-radius:999px;
 background:#fff;color:#374151;cursor:pointer;user-select:none;transition:.12s}
.chip:hover{border-color:#c7ccd4}
.chip.on{background:var(--soft);border-color:#c7d2fe;color:#1d4ed8;font-weight:600}
.chip b{font-weight:600;color:#9ca3af;margin-left:4px;font-size:11px}
.chip.on b{color:#818cf8}
.meta{font-size:12.5px;color:var(--mute);margin:0 0 10px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:13px 16px 11px;
 margin-bottom:9px;cursor:pointer;transition:.13s;border-left:3px solid transparent}
.card:hover{border-color:#d3d8e0;border-left-color:var(--blue);box-shadow:0 3px 10px rgba(16,24,40,.07)}
.top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.name{font-size:13.5px;font-weight:600;color:#4b5563;font-family:ui-monospace,Consolas,monospace;
 word-break:break-all}
.star{font-size:12.5px;color:#b45309;white-space:nowrap;font-weight:600}
.sum{font-size:16.5px;line-height:1.55;margin:6px 0 9px;color:#0f172a}
mark{background:#fff1a8;color:inherit;padding:0 1px;border-radius:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:11.5px;padding:2px 8px;border-radius:5px;background:#f1f3f7;color:#4b5563}
.dot{font-size:11.5px;color:#9ca3af}
.ali{font-size:11.5px;color:#94a3b8;margin-top:7px}
.foot{font-size:11.5px;color:#a1a7b3;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.hit{color:#1d4ed8;background:#f0f4ff;padding:1px 6px;border-radius:4px}
.empty{background:#fff;border:1px dashed #d8dce3;border-radius:11px;padding:26px 18px;
 text-align:center;color:#6b7280;font-size:13.5px;line-height:1.8}
.empty b{color:#111827}
#menu{position:fixed;z-index:99;background:#fff;border:1px solid var(--line);border-radius:9px;
 box-shadow:0 8px 24px rgba(16,24,40,.16);padding:5px;display:none;min-width:196px;font-size:13px}
#menu div{padding:7px 10px;border-radius:6px;cursor:pointer;color:#374151;white-space:nowrap}
#menu div:hover{background:#f2f4f8}
#menu .sep{height:1px;background:var(--line);margin:4px 6px;padding:0;cursor:default}
#menu .sep:hover{background:var(--line)}

</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>GitHub Star 检索</h1>
    <div class="hint" id="cnt"></div>
  </div>
  <div class="box">
    <input id="q" placeholder="想到什么写什么：能把人声分出来的 · 改 hosts 上 github · 25MB 的数据库客户端" autofocus>
    <button id="clr" title="清空">×</button>
  </div>
  <div class="cats" id="cats"></div>
  <div class="meta" id="meta"></div>
  <div id="list"></div>
</div>
<div id="menu"></div>
<script>
const DATA = __DATA__;
const F=0,NAME=1,OWNER=2,SUM=3,TAGS=4,ALI=5,DESC=6,TOPICS=7,LANG=8,STARS=9,PUSHED=10,STATUS=11,LINK=12,CAT=13,PEND=14;
const FIELDW=[[F,6],[SUM,4],[ALI,4],[TAGS,2],[TOPICS,1.5],[DESC,1],[LANG,1]];

function tokenize(s){
  s=(s||'').toLowerCase();
  const out=[];
  const re=/[\u4e00-\u9fff]+|[a-z0-9]+/g;
  let m;
  while((m=re.exec(s))!==null){
    const w=m[0];
    if(w.charCodeAt(0)>=0x4e00&&w.charCodeAt(0)<=0x9fff){
      if(w.length===1) out.push(w);
      else for(let i=0;i<w.length-1;i++) out.push(w.substr(i,2));
    } else out.push(w);
  }
  return out;
}

const TF=[],DL=[],POST=new Map();
DATA.forEach((d,i)=>{
  const mp=new Map(); let ln=0;
  for(const [p,w] of FIELDW){
    for(const tk of tokenize(d[p])){
      mp.set(tk,(mp.get(tk)||0)+w); ln+=w;
    }
  }
  TF.push(mp); DL.push(ln||1);
  for(const tk of mp.keys()){
    let a=POST.get(tk); if(!a){a=[];POST.set(tk,a);} a.push(i);
  }
});
const N=DATA.length, AVGDL=DL.reduce((a,b)=>a+b,0)/N;

let activeCats=new Set();

function num(n){ n=n||0; return n>=1000?(n/1000).toFixed(1).replace('.0','')+'k':''+n; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function hl(text,q){
  const src=esc(text||'');
  if(!q) return src;
  const terms=[];
  const qf=q.replace(/\s+/g,'');
  if(qf.length>=2) terms.push(qf);
  for(const t of tokenize(q)){ if(t.length>=2&&/[a-z0-9]/.test(t)) terms.push(t); }
  if(!terms.length) return src;
  terms.sort((a,b)=>b.length-a.length);
  let out=src;
  for(const t of terms){
    const e=esc(t).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    out=out.replace(new RegExp(e,'gi'),x=>'<mark>'+x+'</mark>');
  }
  return out;
}

function whyHit(d,q,qf){
  const r=[];
  if(qf.length>=2){
    if((d[SUM]||'').toLowerCase().includes(qf)) r.push('摘要');
    if((d[ALI]||'').toLowerCase().includes(qf)) r.push('别名');
    if((d[F]||'').toLowerCase().includes(qf)) r.push('名称');
    if((d[TAGS]||'').toLowerCase().includes(qf)) r.push('标签');
    if((d[DESC]||'').toLowerCase().includes(qf)) r.push('简介');
  }
  return r.length?r.join(' · '):'相关';
}

function search(q){
  const qs=q.trim();
  const qf=qs.replace(/\s+/g,'').toLowerCase();
  if(!qs){
    let cand=[]; DATA.forEach((d,i)=>{ if(!activeCats.size||activeCats.has(d[CAT])) cand.push(i); });
    cand.sort((a,b)=>DATA[b][STARS]-DATA[a][STARS]);
    return {hits:cand.slice(0,40).map(i=>[i,0]), empty:false};
  }
  const qt=[...new Set(tokenize(qs))];
  const k1=1.2,b=0.75, sc=new Map();
  let info=[];
  for(const tk of qt){
    const docs=POST.get(tk);
    if(!docs) continue;
    const df=docs.length;
    info.push([tk,df,Math.log(1+(N-df+0.5)/(df+0.5))]);
  }
  if(info.length>6){ info.sort((x,y)=>y[2]-x[2]); info=info.slice(0,8); }
  if(info.length>=3){
    const kept=info.filter(x=>x[1]<=N/12);
    if(kept.length>=2) info=kept;
  }
  for(const [tk,df,idf] of info){
    const docs=POST.get(tk);
    for(const i of docs){
      if(activeCats.size&&!activeCats.has(DATA[i][CAT])) continue;
      const tf=TF[i].get(tk);
      const s=idf*(tf*(k1+1))/(tf+k1*(1-b+b*DL[i]/AVGDL));
      sc.set(i,(sc.get(i)||0)+s);
    }
  }
  if(qf.length>=2){
    for(const [i,v] of sc){
      const d=DATA[i];
      if((d[SUM]||'').toLowerCase().includes(qf)) sc.set(i,v+9);
      if((d[F]||'').toLowerCase().includes(qf)) sc.set(i,v+7);
      if((d[ALI]||'').toLowerCase().includes(qf)) sc.set(i,v+6);
    }
  }
  const arr=[...sc.entries()].sort((x,y)=> y[1]-x[1] || DATA[y[0]][STARS]-DATA[x[0]][STARS]);
  return {hits:arr.slice(0,30), empty:arr.length===0};
}

function render(){
  const q=document.getElementById('q').value;
  const qf=q.trim().replace(/\s+/g,'').toLowerCase();
  const {hits,empty}=search(q);
  const list=document.getElementById('list');
  const meta=document.getElementById('meta');
  if(empty){
    list.innerHTML='<div class="empty">没找到。<b>多半是库里用的词和你说的不一样</b><br>'+
      '比如你搜「人声分离」，库里写的是「音轨分离」——把新词补成别名，下次就能中。<br>'+
      '<span style="color:#9ca3af">换个说法试试，或点上面的分类缩小范围再搜。</span></div>';
    meta.textContent='0 条';
    return;
  }
  meta.textContent=(q?'命中 ':'默认按 star 排序，共 ')+hits.length+' 条'+(q?'':'（输入关键词开始检索）');
  list.innerHTML=hits.map(([i,sc])=>{
    const d=DATA[i];
    const tags=(d[TAGS]||'').split(',').filter(Boolean).slice(0,4)
      .map(t=>'<span class="tag">'+esc(t)+'</span>').join('');
    const ali=(d[ALI]||'').split(',').filter(Boolean).slice(0,6);
    return '<div class="card" data-u="'+esc(d[LINK])+'">'+
      '<div class="top"><span class="name">'+esc(d[F])+'</span>'+
      '<span class="star">★ '+num(d[STARS])+'</span></div>'+
      '<div class="sum">'+hl(d[SUM],q)+'</div>'+
      '<div class="row">'+tags+
        (d[LANG]?'<span class="dot">'+esc(d[LANG])+'</span>':'')+
        '<span class="dot">'+esc(d[STATUS]||'')+'</span>'+
      '</div>'+
      (ali.length?'<div class="ali">别名：'+ali.map(esc).join('、')+'</div>':'')+
      (d[PEND]?'<div class="ali" style="color:#b45309">待总结 · 按 PROMPT.md 补一句摘要后再重建</div>':'')+
      '<div class="foot"><span class="hit">命中：'+
        esc(q?whyHit(d,q,qf):'—')+'</span>'+
        '<span>最近提交 '+esc(d[PUSHED]||'—')+'</span>'+
        '<span>'+esc(d[CAT]||'')+'</span></div>'+
    '</div>';
  }).join('');
  list.querySelectorAll('.card').forEach(c=>{
    c.onclick=()=>{ const u=c.getAttribute('data-u'); if(u) window.open(u,'_blank','noopener'); };
  });
  syncURL(q.trim());
}

function buildChips(){
  const cnt={};
  DATA.forEach(d=>{ cnt[d[CAT]]=(cnt[d[CAT]]||0)+1; });
  const cats=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  const box=document.getElementById('cats');
  box.innerHTML=cats.map(c=>'<div class="chip" data-c="'+esc(c)+'">'+esc(c)+'<b>'+cnt[c]+'</b></div>').join('');
  box.querySelectorAll('.chip').forEach(el=>{
    el.onclick=()=>{
      const c=el.getAttribute('data-c');
      if(activeCats.has(c)) activeCats.delete(c); else activeCats.add(c);
      el.classList.toggle('on');
      render();
    };
  });
  document.getElementById('cnt').textContent=DATA.length+' 条 / '+cats.length+' 类';
}

let t;
document.getElementById('q').oninput=e=>{
  document.getElementById('clr').style.display=e.target.value?'block':'none';
  clearTimeout(t); t=setTimeout(render,120);
};
document.getElementById('q').onkeydown=e=>{ if(e.key==='Escape'){ e.target.value=''; render(); } };
document.getElementById('clr').onclick=()=>{
  document.getElementById('q').value=''; document.getElementById('clr').style.display='none'; render();
};

buildChips(); render();

/* ---------- 新建搜索 / 右键菜单 / URL 直链 ---------- */
const qEl=document.getElementById('q');
const menuEl=document.getElementById('menu');

function searchURL(word){
  const u=new URL(location.href);
  u.search=''; u.hash='';
  if(word) u.searchParams.set('q',word);
  return u.toString();
}
function openNewSearch(word){
  window.open(searchURL(word),'_blank','noopener');
}
function hideMenu(){ menuEl.style.display='none'; }

function showMenu(x,y,items){
  menuEl.innerHTML='';
  items.forEach(it=>{
    const d=document.createElement('div');
    if(it.sep){ d.className='sep'; menuEl.appendChild(d); return; }
    d.textContent=it.label;
    d.onclick=ev=>{ ev.stopPropagation(); hideMenu(); it.fn(); };
    menuEl.appendChild(d);
  });
  menuEl.style.display='block';
  const w=menuEl.offsetWidth,h=menuEl.offsetHeight;
  menuEl.style.left=Math.min(x,window.innerWidth-w-8)+'px';
  menuEl.style.top=Math.min(y,window.innerHeight-h-8)+'px';
}

qEl.addEventListener('contextmenu',e=>{
  e.preventDefault(); e.stopPropagation();
  const sel=(window.getSelection?window.getSelection().toString():'').trim();
  const items=[{label:'新建搜索（新标签页）',fn:()=>openNewSearch(qEl.value.trim())}];
  if(sel) items.push({label:'用「'+(sel.length>14?sel.slice(0,14)+'…':sel)+'」新建搜索',fn:()=>openNewSearch(sel)});
  items.push({sep:true});
  items.push({label:'复制输入框内容',fn:()=>{
    try{ navigator.clipboard.writeText(qEl.value); }catch(err){}
  }});
  items.push({label:'清空',fn:()=>{ qEl.value=''; document.getElementById('clr').style.display='none'; syncURL(''); render(); }});
  showMenu(e.clientX,e.clientY,items);
});

document.addEventListener('click',hideMenu);
document.addEventListener('scroll',hideMenu,true);
window.addEventListener('resize',hideMenu);
document.addEventListener('keydown',e=>{ if(e.key==='Escape') hideMenu(); });

function syncURL(q){
  try{
    const u=new URL(location.href);
    u.search=''; u.hash='';
    if(q) u.searchParams.set('q',q);
    history.replaceState(null,'',u.toString());
  }catch(err){}
}

// 打开时若带 ?q= 或 #q=，直接进入该关键词的检索结果
(function initFromURL(){
  let seed='';
  try{
    seed=new URLSearchParams(location.search).get('q')||'';
    if(!seed&&location.hash&&location.hash.length>1) seed=decodeURIComponent(location.hash.slice(1));
  }catch(err){}
  seed=(seed||'').trim();
  if(seed){
    qEl.value=seed;
    document.getElementById('clr').style.display='block';
    render();
  }
})();

</script>
</body>
</html>
